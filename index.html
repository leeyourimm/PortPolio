<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이유림 SAP ABAP Portfolio</title>
<meta name="description" content="SAP ABAP 개발자 이유림의 포트폴리오. SD 판매·청구 프로그램, RAP 기반 MM·FI 연계 프로그램, BAPI 외부 DB–SAP 전표 인터페이스 프로그램 스펙.">
<meta name="author" content="이유림">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151E" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="이유림 · SAP ABAP Developer">
<meta property="og:description" content="SAP ABAP 개발자 이유림의 포트폴리오. SD 판매·청구 프로그램, RAP 기반 MM·FI 연계 프로그램, BAPI 외부 DB–SAP 전표 인터페이스 프로그램 스펙.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#15202D; --muted:#5B6878; --faint:#8793A2;
  --line:#DCE2EA; --accent:#1A5DA8; --accent-ink:#FFFFFF; --accent-soft:#E5EDF7;
  --mine:#A86A12; --mine-soft:#FAF0DE; --mine-line:#E3B764;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 8px 24px rgba(20,35,55,.06);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E151E; --surface:#152030; --surface-2:#1A2738; --ink:#E5ECF4; --muted:#A0AEBF; --faint:#76869A;
  --line:#26364A; --accent:#72AAE9; --accent-ink:#0E151E; --accent-soft:#18304C;
  --mine:#E5AE50; --mine-soft:#332917; --mine-line:#8A6526;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E151E; --surface:#152030; --surface-2:#1A2738; --ink:#E5ECF4; --muted:#A0AEBF; --faint:#76869A;
  --line:#26364A; --accent:#72AAE9; --accent-ink:#0E151E; --accent-soft:#18304C;
  --mine:#E5AE50; --mine-soft:#332917; --mine-line:#8A6526;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
@media (max-width:560px){.wrap{padding-inline:16px}}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px;position:relative}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand b{font-weight:700;font-size:17px}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.navlinks{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.navlinks button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.navlinks button:hover{color:var(--ink);background:var(--surface-2)}
.navlinks button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center}
.menubtn i{display:block;width:18px;height:2px;background:var(--ink);position:relative}
.menubtn i::before,.menubtn i::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink)}
.menubtn i::before{top:-6px}.menubtn i::after{top:6px}
@media (max-width:760px){
  .menubtn{display:flex}
  .navlinks{position:absolute;left:0;right:0;top:58px;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 16px;box-shadow:var(--shadow);display:none}
  .navlinks.open{display:flex}
  .navlinks button{width:100%;text-align:left;padding:12px}
}

.hero{padding-block:56px 40px}
.who{display:flex;align-items:baseline;gap:12px;color:var(--muted);margin-bottom:14px}
.who b{color:var(--ink);font-size:18px}
.who span{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em}
.hero h1{font-size:clamp(36px,5.6vw,58px);font-weight:700;letter-spacing:-.025em;line-height:1.08}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:clamp(16.5px,1.8vw,18.5px);margin-top:18px;max-width:34em}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-family:var(--mono);font-size:12.5px;padding:5px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}

.proj{padding-block:72px;scroll-margin-top:60px;border-bottom:1px solid var(--line)}
.proj.alt{background:var(--surface)}
.proj-h{display:grid;gap:8px;margin-bottom:24px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.proj-h h2{font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.01em}
.proj-h .theme{font-size:17px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);margin:0}
.proj:not(.alt) .meta{background:var(--surface)}
.meta div{padding:12px 16px;border-right:1px solid var(--line)}
.meta div:last-child{border-right:0}
.meta dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.meta dd{margin:2px 0 0;font-weight:600;font-size:14.5px}
@media (max-width:760px){.meta{grid-template-columns:1fr 1fr}.meta div:nth-child(2){border-right:0}.meta div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.sub-h{font-size:13px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:36px 0 12px;scroll-margin-top:76px}

.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line);background:var(--surface)}
.legend i.mine{background:var(--mine-soft);border-color:var(--mine-line)}
.lane{display:flex;align-items:stretch}
.node{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.proj.alt .node{background:var(--bg)}
.node.mine,.proj.alt .node.mine{border-color:var(--mine-line);background:var(--mine-soft)}
.node .m{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.node.mine .m{color:var(--mine)}
.node b{font-size:14px;font-weight:600;line-height:1.35}
.node small{font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.arrow{flex:0 0 24px;display:grid;place-items:center;color:var(--faint)}
.arrow svg{width:16px;height:16px}
@media (max-width:760px){.lane{flex-direction:column}.arrow{flex-basis:20px}.arrow svg{transform:rotate(90deg)}}
.fnote{font-size:13.5px;color:var(--muted);margin-top:10px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.proj.alt .tbl{background:var(--bg)}
.tbl table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl thead th{background:var(--surface-2);font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.05em;white-space:nowrap}
.tbl td.mono{font-size:12.5px}
.tbl tr.mine td{background:var(--mine-soft)}
.tbl a{font-weight:600;text-decoration:none}
.tbl a:hover{text-decoration:underline}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--mine-line);color:var(--mine);margin-left:6px;vertical-align:1px}

.tags{display:flex;gap:5px;flex-wrap:wrap}
.mod{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.mod.m{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.fig{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.fig button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.fig img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff}
.fig figcaption{font-size:12.5px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--line)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}

/* 프로젝트 화면: 프로그램 카드 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.proj.alt .pcard{background:var(--bg)}
/* 메인: 프로젝트 카드 */
.projects{padding-block:8px 64px;scroll-margin-top:60px}
.projects h2{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:14px}
.projgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:880px){.projgrid{grid-template-columns:1fr}}
.prcard{display:flex;flex-direction:column;gap:8px;padding:22px 22px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.prcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.prcard b{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.prcard p{font-size:14px;color:var(--muted);line-height:1.55}
.prcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font-size:13px}
.prcard dt{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.04em;align-self:center}
.prcard dd{margin:0}
.prcard .go{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--accent)}
.prcard .go span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.pcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-no{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.pcard b{font-size:16.5px;font-weight:700;line-height:1.35}
.pc-code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-4px}
.pcard p{font-size:13.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.pc-foot .go{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}

/* 코드 블록: 에디터 화면 */
.code{margin:0 0 20px;border-radius:10px;overflow:hidden;background:#1e2230;border:1px solid #2c3242;box-shadow:var(--shadow)}
.code-h{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#262b3b;border-bottom:1px solid #2c3242;font-size:13px;color:#c9d1e4;line-height:1.45}
.code-h i{flex:none;display:flex;gap:6px}
.code-h i b{width:10px;height:10px;border-radius:50%;background:#4a5268}
.code-h i b:nth-child(1){background:#ff5f57}.code-h i b:nth-child(2){background:#febc2e}.code-h i b:nth-child(3){background:#28c840}
.code-h span{flex:1;min-width:0}
.code-h em{flex:none;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8790a8}
.code pre code{display:block;background:none;border:0;padding:0;border-radius:0;color:inherit;font:inherit;white-space:normal;overflow-wrap:normal}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:#d8deeb;tab-size:2}
.code pre + pre{border-top:1px dashed #3a4156}
.code .ln{display:block;padding-right:16px;white-space:pre}
.code .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:1em;margin-right:.6em;text-align:right;color:#59627a;border-right:1px solid #2f3547;user-select:none}
.code .k{color:#c99bff}.code .s{color:#a6e0a0}.code .c{color:#7d879f;font-style:italic}.code .n{color:#f5b37a}.code .t{color:#7fc4ff}.code .a{color:#f0d68a}
@media (max-width:560px){.code pre{font-size:12px}.code .ln::before{width:2.4em;padding-right:.6em;margin-right:.4em}}

/* 프로그램 상세 페이지 */
.pg{padding-block:20px 72px;min-height:calc(100vh - 58px)}
.crumb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--muted);font-size:13.5px;cursor:pointer;text-align:left}
.crumb:hover{color:var(--accent)}
.pg-h{display:grid;gap:12px;padding:18px 0 22px}
.pg-eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.pg-eyebrow span{color:var(--faint);font-weight:500}
.pg-h h1{font-size:clamp(26px,3.6vw,36px);font-weight:700;letter-spacing:-.015em}
.pg-code{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pg-ov{font-size:16.5px;max-width:50em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);position:sticky;top:calc(58px + env(safe-area-inset-top,0px));background:var(--bg);z-index:5}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:13px 18px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:560px){.tab{flex:1 1 0;padding:12px 6px;font-size:14.5px}}
.tabpanel{padding-top:24px}
.tabpanel:focus-visible{outline-offset:6px}
.shots{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.shots .fig{flex:0 1 auto;max-width:100%}
.shots .fig img{max-height:none}
.shots .fig figcaption{font-size:13.5px;padding:9px 14px}
.shots-h{font-size:15.5px;font-weight:700;margin:40px 0 14px;padding-left:11px;border-left:3px solid var(--accent)}
.tabpanel > .shots-h:first-child{margin-top:4px}
.cfg{margin-top:16px}
.nlist{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:10px;max-width:62em}
.nlist li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:15.5px}
.nlist li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600;padding-top:3px}
.pg code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.lblks{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;max-width:62em}
.lblk{min-width:0}
.lblk h3{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:17px;line-height:1.45}
.lblk h3 span{flex:none;font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.lblk > p{margin:0 0 12px;color:var(--ink);font-size:15px;line-height:1.7}
.lblk .code{margin:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.vg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--surface)}
.vg code{display:block;margin-bottom:2px;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pn{display:grid;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.pn:hover{border-color:var(--accent)}
.pn small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pn b{font-size:15px;font-weight:600}
.pn.next{text-align:right;grid-column:2}
@media (max-width:560px){.pnav{grid-template-columns:1fr}.pn.next{grid-column:1;text-align:left}}

.contact{padding-block:56px}
.contact .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
.contact h2{font-size:clamp(22px,3vw,28px);font-weight:700}
.citem{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.citem .v{font-family:var(--mono);font-weight:600;font-size:16px;user-select:all}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:13px;color:var(--faint)}

.lb{position:fixed;inset:0;z-index:80;background:rgba(5,9,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;gap:12px;overflow:auto;overscroll-behavior:contain}
.lb img{max-width:100%;max-height:82vh;object-fit:contain;background:#fff;border-radius:6px}
.lb.big img{cursor:zoom-in}
.lb.full{display:block;padding:68px 12px 28px}
.lb.full img{display:block;max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}
.lb p{color:#dfe7f0;font-size:13.5px;text-align:center}
.lb.full p{margin-top:12px}
.lb p small{display:block;color:#9fb0c2;font-size:12.5px}
.lb button{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>

  const m = /^#\/([a-z]+)(?:\/(\d+))?$/.exec(h || "");

  if (p && !m[2]) return { pid:p.id, i:-1 };
  if (p) { const i = Number(m[2]) - 1; if (p.specs[i]) return { pid:p.id, i }; }
  return { pid:null, i:-1 };
};

/* 코드 하이라이트: 언어별 간단한 토큰 분리 (주석 · 문자열 · 키워드 · 숫자) */
const KW = {
  abap: "abap_false abap_true add and append appending as assign assigning at authorization begin binary by call case catch changing check class clear collect commit concatenate condense cond constants continue conv corresponding create data default define delete describe display do else elseif end endcase endclass endfor endform endfunction endif endloop endmethod endmodule endselect endtry endwhile entities entity event exceptions execute exit exporting fetch field fields fields-symbols field-symbol field-symbols for form free from function get group if implementation import importing in include index initial inner insert into is join key leave left like line lines local loop me method methods mode modify module move new not of on or order others output parameter parameters perform private protected public raise raising read receiving ref refresh reported result return returning rollback screen select selection-screen set single skip sort split start-of-selection submit table tables then to transaction try type types unassign up update using value values when where while with work",
  cds: "and as association cast case define distinct else end entity from group having inner join key left on or order projection root select then to view when where with",
  bdef: "action authorization create delete dependent determination draft etag field implementation in lock managed master mapping parameter persistent result strict table unique update use validation with",
  js: "async await break case catch class const continue default delete do else export false for from function if import in instanceof let new null return switch this throw true try typeof undefined var void while",
};
const KWS = Object.fromEntries(Object.entries(KW).map(([k, v]) => [k, new Set(v.split(" "))]));
const RX = {
  abap: /("[^\n]*$)|(^\*[^\n]*$)|('(?:[^'])*'|`(?:[^`])*`|\|(?:[^|\\]|\\.)*\|)|(\b\d+\b)|([A-Za-z_][\w\-~>]*)/g,
  cds: /(\/\/[^\n]*$)|('(?:[^'])*')|(\b\d+\b)|(@[\w.]+)|([A-Za-z_][\w]*)/g,
  bdef: /(\/\/[^\n]*$)|('(?:[^'])*')|(\b\d+\b)|([A-Za-z_][\w]*)/g,
  js: /(\/\/[^\n]*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g,
};
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const sp = (cls, t) => `<span class="${cls}">${esc(t)}</span>`;
function hlLine(line, lang){
  if (lang === "xml") {
    const rx = /(<!--.*?-->)|(<\/?)([\w:.]+)|([\w:.-]+)=("[^"]*"?)/g;
    let out = "", last = 0, m;
    while ((m = rx.exec(line))) {
      out += esc(line.slice(last, m.index)); last = rx.lastIndex;
      out += m[1] ? sp("c", m[1]) : m[2] ? esc(m[2]) + sp("t", m[3]) : sp("a", m[4]) + "=" + sp("s", m[5]);
    }
    return out + esc(line.slice(last));
  }
  const rx = RX[lang] || RX.abap, kws = KWS[lang] || KWS.abap;
  let out = "", last = 0, m;
  rx.lastIndex = 0;
  while ((m = rx.exec(line))) {
    out += esc(line.slice(last, m.index)); last = rx.lastIndex;
    const t = m[0];
    if (lang === "abap") out += m[1] || m[2] ? sp("c", t) : m[3] ? sp("s", t) : m[4] ? sp("n", t) : kws.has(t.toLowerCase()) ? sp("k", t) : esc(t);
    else if (lang === "cds") out += m[1] ? sp("c", t) : m[2] ? sp("s", t) : m[3] ? sp("n", t) : m[4] ? sp("a", t) : kws.has(t.toLowerCase()) ? sp("k", t) : esc(t);
    else out += m[1] ? sp("c", t) : m[2] ? sp("s", t) : m[3] ? sp("n", t) : kws.has(lang === "bdef" ? t.toLowerCase() : t) ? sp("k", t) : esc(t);
    if (!t.length) rx.lastIndex++;
  }
  return out + esc(line.slice(last));
}
const LANG = { abap:"ABAP", cds:"CDS", bdef:"BDEF", js:"JavaScript", xml:"XML View" };
function CodeBlock({ k, c, cap }){
  c = c || (window.CODE || {})[k];
  if (!c) return null;
  return html`<figure class="code">
    <figcaption class="code-h"><i aria-hidden="true"><b></b><b></b><b></b></i><span>${cap}</span><em>${LANG[c.lang] || c.lang}</em></figcaption>
    ${c.panes.map((pn, j) => html`<pre key=${j} tabIndex="0" aria-label=${cap + " 코드"}><code dangerouslySetInnerHTML=${{ __html: pn.src.split("\n").map((l, n) => `<span class="ln" data-n="${n + 1}">${hlLine(l, pn.lang) || " "}</span>`).join("") }}></code></pre>`)}
  </figure>`;
}

/* 캡처 목록: [키, 설명, 폭, 높이], 문자열은 묶음 제목 */
function Shots({ list, onZoom }){
  const groups = [];
  list.forEach(e => {
    if (typeof e === "string") groups.push({ h:e, fs:[] });
    else { if (!groups.length) groups.push({ h:null, fs:[] }); groups[groups.length - 1].fs.push(e); }
  });
  return groups.map((g, j) => html`<${React.Fragment} key=${j}>
    ${g.h ? html`<h3 class="shots-h">${g.h}</h3>` : null}
    <div class="shots">${g.fs.map(([k, c, w, h]) => html`<${Figure} key=${k} k=${k} cap=${c} w=${w} h=${h} onZoom=${onZoom} />`)}</div>
  </${React.Fragment}>`);
}

function ProgramCard({ p, s, i, to }){
  const h = hashOf(p.id, i);

function ProjectPage({ p, onZoom, to }){

    ${p.erd ? html`<h3 class="sub-h">DB 설계</h3><${Figure} k=${p.erd[0]} cap=${p.erd[1]} onZoom=${onZoom} />` : null}
    ${p.config ? html`<h3 class="sub-h">기준정보 설정 (IMG)</h3><div class="tbl"><table><thead><tr><th>모듈</th><th>T-Code</th><th>설정 내용</th></tr></thead><tbody>
      ${p.config.map(r => html`<tr key=${r[0]}><td><b>${r[0]}</b></td><td class="mono">${r[1]}</td><td>${r[2]}</td></tr>`)}</tbody></table></div>` : null}
    ${p.configImgs ? html`<div class="shots cfg">${p.configImgs.map(([k, c, w, h]) => html`<${Figure} key=${k} k=${k} cap=${c} w=${w} h=${h} onZoom=${onZoom} />`)}</div>` : null}
    <nav class="pnav" aria-label="이전 · 다음 프로젝트">
      ${k > 0 ? step(PROJECTS[k - 1], "prev", "← 이전 프로젝트") : null}
      ${k < PROJECTS.length - 1 ? step(PROJECTS[k + 1], "next", "다음 프로젝트 →") : null}
    </nav>
  </div></main>`;
}

function ProgramPage({ p, i, onZoom, to }){
  const s = p.specs[i];
  const blocks = (window.LOGIC || {})[p.id + "/" + i];
  const code = blocks ? [] : s.codeImgs || [];
  const tabs = [
    s.imgs.some(e => typeof e !== "string") ? ["scr", "화면"] : null,
    ["fn", "주요 기능"],
    blocks || s.logic.length || code.length || s.validations ? ["logic", "핵심 로직"] : null,
  ].filter(Boolean);
  const [tab, setTab] = useState(tabs[0][0]);
  const tabRefs = useRef({});
  const head = useRef(null);
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const el = head.current; if (!el) return;
    const y = el.getBoundingClientRect().bottom + window.scrollY - NAV_H;
    if (window.scrollY > y + 1) jump(() => window.scrollTo(0, y));
  }, [tab]);
  const onKey = (e) => {
    const ids = tabs.map(t => t[0]); let k = ids.indexOf(tab);
    if (e.key === "ArrowRight") k = (k + 1) % ids.length;
    else if (e.key === "ArrowLeft") k = (k - 1 + ids.length) % ids.length;
    else if (e.key === "Home") k = 0;
    else if (e.key === "End") k = ids.length - 1;
    else return;
    e.preventDefault(); setTab(ids[k]); tabRefs.current[ids[k]] && tabRefs.current[ids[k]].focus();
  };
  const step = (j, cls, label) => { const h = hashOf(p.id, j); return html`<a class=${"pn " + cls} href=${h} onClick=${linkTo(h, to)}><small>${label}</small><b>${pad(j)} ${p.specs[j].t}</b></a>`; };
  return html`<main class="pg"><div class="wrap">
    <button class="crumb" onClick=${() => to(projHash(p.id), p.id + "-list")}>← ${p.no} · ${p.title}</button>
    <header class="pg-h" ref=${head}>
      <div class="pg-eyebrow">PROGRAM ${pad(i)} <span>/ ${pad(p.specs.length - 1)}</span></div>
      <h1>${s.t}</h1>
      ${s.code ? html`<div class="pg-code">${s.code}</div>` : null}
      <div class="tags">${s.mods.map(m => html`<span class="mod m" key=${m}>${m}</span>`)}<span class="mod">${s.type}</span></div>
      <p class="pg-ov">${s.ov}</p>
      ${s.video || s.links ? html`<div class="links">
        ${s.video ? html`<a class="sbtn" href=${s.video} target="_blank" rel="noopener">시연 영상 ↗</a>` : null}
        ${(s.links || []).map(([t, u]) => html`<a class="sbtn" key=${t} href=${u} target="_blank" rel="noopener">${t} ↗</a>`)}</div>` : null}
    </header>
    <div class="tabs" role="tablist" aria-label="프로그램 스펙" onKeyDown=${onKey}>
      ${tabs.map(([id, l]) => html`<button key=${id} id=${"tab-" + id} class="tab" role="tab" aria-selected=${tab === id} aria-controls=${"panel-" + id} tabIndex=${tab === id ? 0 : -1} ref=${(el) => { tabRefs.current[id] = el; }} onClick=${() => setTab(id)}>${l}</button>`)}
    </div>
    <div class="tabpanel" role="tabpanel" id=${"panel-" + tab} aria-labelledby=${"tab-" + tab} tabIndex="0">
      ${tab === "scr" ? html`<${Shots} list=${s.imgs} onZoom=${onZoom} />` : null}
      ${tab === "fn" ? html`<ol class="nlist">${s.fn.map((f, j) => html`<li key=${j}><span>${f}</span></li>`)}</ol>` : null}
      ${tab === "logic" ? html`<div>
        ${blocks ? html`<div class="lblks">${blocks.map((b, j) => html`<section class="lblk" key=${j}>
          <h3><span>${pad(j)}</span>${b.h}</h3>
          <p><${Rich} s=${b.d} /></p>
          <${CodeBlock} c=${{ lang:b.lang, panes:[{ lang:b.lang, src:b.src }] }} cap=${b.cap || b.h} />
        </section>`)}</div>` : s.logic.length ? html`<ol class="nlist">${s.logic.map((f, j) => html`<li key=${j}><${Rich} s=${f} /></li>`)}</ol>` : null}
        ${code.length ? html`<h2 class="sub-h">코드 (${code.length})</h2>${code.map(([k, c, w, h]) => (window.CODE || {})[k] ? html`<${CodeBlock} key=${k} k=${k} cap=${c} />` : html`<div class="shots" key=${k}><${Figure} k=${k} cap=${c} w=${w} h=${h} onZoom=${onZoom} /></div>`)}` : null}
        ${s.validations ? html`<h2 class="sub-h">Validation (${s.validations.length})</h2><div class="vgrid">${s.validations.map(([n, d]) => html`<div class="vg" key=${n}><code>${n}</code>${d}</div>`)}</div>` : null}
      </div>` : null}
    </div>
    <nav class="pnav" aria-label="이전 · 다음 프로그램">
      ${i > 0 ? step(i - 1, "prev", "← 이전 프로그램") : null}
      ${i < p.specs.length - 1 ? step(i + 1, "next", "다음 프로그램 →") : null}
    </nav>
  </div></main>`;
}

function Contact(){
  const [copied, setCopied] = useState(false);
  const sel = () => { const el = document.getElementById("email-v"); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  const copy = () => { try { navigator.clipboard.writeText(PROFILE.email).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); }, sel); } catch (e) { sel(); } };
  return html`<section class="contact" id="contact"><div class="wrap">
    <h2>Contact</h2>
    <div class="citem"><span class="v" id="email-v">${PROFILE.email}</span>
      <button class="sbtn" onClick=${copy}>${copied ? "복사됨" : "주소 복사"}</button>
      <a class="sbtn" href=${"mailto:" + PROFILE.email}>메일 쓰기</a></div>
  </div></section>`;
}

/* 확대 보기: 화면 맞춤 ↔ 원본 크기(이미지 클릭), 바깥 클릭 · Esc로 닫기 */
function Lightbox({ z, onClose }){
  const [big, setBig] = useState(false);
  const [full, setFull] = useState(false);
  const onLoad = (e) => { const t = e.currentTarget; setBig(t.naturalWidth > t.clientWidth + 8 || t.naturalHeight > t.clientHeight + 8); };
  const toggle = (e) => { if (!big) return; e.stopPropagation(); setFull(!full); };
  return html`<div class=${"lb" + (big ? " big" : "") + (full ? " full" : "")} onClick=${onClose}>
    <button aria-label="닫기">×</button>
    <img src=${img(z[0])} alt=${z[1]} onLoad=${onLoad} onClick=${toggle} />
    <p>${z[1]}${big ? html`<small>${full ? "이미지를 누르면 화면에 맞춥니다" : "이미지를 누르면 원본 크기로 봅니다"}</small>` : null}</p>
  </div>`;
}

try { history.scrollRestoration = "manual"; } catch (e) {} // 스크롤 위치는 App이 직접 복원
function App(){
  const [route, setRoute] = useState(() => parse(location.hash));
  const routeRef = useRef(route), pos = useRef({}), fresh = useRef(false), pending = useRef(null);
  const [active, setActive] = useState("home");
  const [zoom, setZoom] = useState(null);
  /* 링크로 들어가면 맨 위(또는 지정 섹션), 뒤로 · 앞으로 가기면 떠날 때 위치로 복원 */
  const apply = (r, isFresh) => {
    if (same(r, routeRef.current)) return;
    pos.current[keyOf(routeRef.current)] = window.scrollY;
    fresh.current = !!isFresh;
    routeRef.current = r; setZoom(null); setRoute(r);
  };
  const to = (h, sec) => {
    const r = parse(h);
    if (same(r, routeRef.current)) { if (sec) go(sec); else jump(() => window.scrollTo(0, 0)); return; }
    pending.current = sec || null;
    try { if (location.hash !== h) location.hash = h; } catch (e) {}
    apply(r, true);
  };
  const onNav = (id) => PROJECTS.some(q => q.id === id) ? to(projHash(id)) : to("", id === "home" ? null : id);
  useEffect(() => { const on = () => apply(parse(location.hash)); addEventListener("hashchange", on); return () => removeEventListener("hashchange", on); }, []);
  useLayoutEffect(() => {
    const sec = pending.current; pending.current = null;
    const el = sec ? document.getElementById(sec) : null;
    const y = fresh.current ? 0 : pos.current[keyOf(route)] || 0;
    jump(() => el ? el.scrollIntoView({ block:"start" }) : window.scrollTo(0, y));
  }, [route]);
  useEffect(() => {
    if (route.pid) { setActive(route.pid); return; }
    setActive("home");
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setActive(e.target.id === "contact" ? "contact" : "home"); }), { rootMargin:"-40% 0px -55% 0px" });
    ["home", "projects", "contact"].forEach(id => { const el = document.getElementById(id); el && io.observe(el); });
    return () => io.disconnect();
  }, [route.pid]);
  useEffect(() => { const k = e => { if (e.key === "Escape") setZoom(null); }; addEventListener("keydown", k); return () => removeEventListener("keydown", k); }, []);
  const p = route.pid ? PROJECTS.find(x => x.id === route.pid) : null;
  return html`<${React.Fragment}>
    <${Navbar} active=${active} onNav=${onNav} />
    ${p && route.i >= 0 ? html`<${ProgramPage} key=${p.id + "-" + route.i} p=${p} i=${route.i} onZoom=${setZoom} to=${to} />`
    : p ? html`<${ProjectPage} key=${p.id} p=${p} onZoom=${setZoom} to=${to} />`
    : html`<${React.Fragment}>
      <${Hero} />
      <main><section class="projects" id="projects"><div class="wrap">
        <h2>PROJECTS</h2>
        <div class="projgrid">${PROJECTS.map(q => html`<${ProjectCard} key=${q.id} p=${q} to=${to} />`)}</div>
      </div></section></main>
      <${Contact} />
    </${React.Fragment}>`}
    <footer><div class="wrap">© 2026 ${PROFILE.name}</div></footer>
    ${zoom ? html`<${Lightbox} key=${zoom[0]} z=${zoom} onClose=${() => setZoom(null)} />` : null}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
